name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            core/package-lock.json
            web/package-lock.json
      - run: npm run setup
      - run: npm audit && npm audit --prefix core && npm audit --prefix web
      - run: npm run compliance && git diff --exit-code -- THIRD_PARTY_NOTICES.md sbom.spdx.json
      - run: npm run check
      - run: npm run probe:all
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
