name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # Same database docker-compose.yml starts locally: the checks boot the real server on it.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: qwbe
          POSTGRES_DB: qwbe
        ports:
          - 5433:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            core/package-lock.json
            web/package-lock.json
      - run: npm run setup
      # The secrets gate of `check` runs the gitleaks binary itself.
      - run: go install github.com/zricethezav/gitleaks/v8@latest && echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
