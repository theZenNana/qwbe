# Read by core/tools/shared/config.ts with a strict schema: an unknown key is an error.
version: 1
dev:
  api: 4500
  web: 4510
untested:
  - core/plugins/example-plugin/cubes/bookmarks
# Blocking budgets for `check --bench`, held against the medians by core/tools/check/bench-budget.ts.
# list60k: the thresholds of probes/list.mjs (page 300 under max(250 ms, 4 x page 1), every answer
# under 1 s). stagingImport: a third of the reference median. Reference 2026-09-26, two runs of
# `check --bench` (core/src unchanged): medians 15949.9 ms (6270 rows/s) and 14332.3 ms (6977 rows/s);
# a third of the slower median is 2090 rows/s. The earlier 7500 came from a probe that measured differently.
bench:
  list60k: { deepPageFloorMs: 250, deepPageFactor: 4, anyAnswerMs: 1000 }
  stagingImport: { minRowsPerSecond: 2090 }
