# One Postgres for all cubes, one schema per cube (ADR-0001, QWB-44).
# Local dev only: the port and password come from the environment with
# harmless defaults, so no real secret is ever written here.
services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qwbe}
      POSTGRES_DB: qwbe
    ports:
      - "${QWBE_PG_PORT:-5433}:5432"
    volumes:
      - qwbe-pgdata:/var/lib/postgresql/data

  # Dev-only, opt-in local viewer (docker compose --profile trace up -d lgtm);
  # in-memory storage, everything is gone when it stops.
  lgtm:
    image: grafana/otel-lgtm:0.34.0
    profiles: [trace]
    ports:
      - "127.0.0.1:3000:3000"  # Grafana
      - "127.0.0.1:4318:4318"  # OTLP HTTP

volumes:
  qwbe-pgdata:
